<!DOCTYPE html>
<!--
  Initio Audio Recorder — Google Slides sidebar
  Drop-in Apps Script HTML Service file. Serve with:
      HtmlService.createHtmlOutputFromFile('Sidebar').setTitle('Audio Recorder')
  Works standalone in a browser too (google.script.run is stubbed at the bottom).
-->
<html>
<head>
<meta charset="utf-8" />
<base target="_top" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #283e49;
    --ink-hover: #1c2e37;
    --aqua: #89ccca;
    --aqua-deep: #2f8f86;
    --aqua-tint: #e9f4f3;
    --yellow: #ffce32;
    --cream: #f4f3ef;
    --surface: #ffffff;
    --surface-alt: #fbfbf9;
    --border: #e6e4dd;
    --rule: #f1f3f4;
    --muted: #8b8a83;
    --body: #5c6a72;
    --r-btn: 8px;
    --r-card: 10px;
    --pad: 16px;
    --gap: 18px;
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--surface); color: var(--ink);
    font: 500 13px/1.5 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px var(--pad); border-bottom: 1px solid var(--rule);
  }
  header .mark { width: 22px; height: 22px; border-radius: 5px; flex: none; }
  header h1 { font: 700 14px/1 'Manrope', sans-serif; letter-spacing: -.01em; margin: 0; }

  main { flex: 1; padding: 20px var(--pad); display: flex; flex-direction: column; }
  footer { padding: 10px var(--pad); border-top: 1px solid var(--rule); font-size: 10px; color: #9aa0a6; }

  /* ---- state machine: only one panel visible, cross-faded ---- */
  .panel { display: none; flex-direction: column; gap: var(--gap); flex: 1; }
  .panel[data-active] { display: flex; animation: panelIn .34s var(--ease) both; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .lead { color: var(--body); }
  .label { font: 700 11px/1 'Manrope', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .rule { height: 1px; background: var(--rule); }

  /* ---- record button ---- */
  .recWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 0; }
  .recStack { position: relative; width: 76px; height: 76px; }
  .recBtn {
    position: relative; z-index: 1; width: 76px; height: 76px; border: 0; border-radius: 50%;
    background: var(--ink); cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(40,62,73,.28);
    transition: transform .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease);
  }
  .recBtn:hover { background: var(--ink-hover); transform: translateY(-1px); box-shadow: 0 9px 22px rgba(40,62,73,.32); }
  .recBtn:active { transform: scale(.94); box-shadow: 0 4px 12px rgba(40,62,73,.26); }
  .recBtn:focus-visible { outline: 3px solid var(--aqua); outline-offset: 3px; }
  .recBtn .glyph {
    width: 18px; height: 30px; border-radius: 9px; background: #fff;
    transition: width .26s var(--ease), height .26s var(--ease), border-radius .26s var(--ease);
  }
  .recBtn.is-recording .glyph { width: 24px; height: 24px; border-radius: 5px; }
  /* yellow pulse rings while recording — no red anywhere */
  .ring { position: absolute; inset: 0; border-radius: 50%; background: var(--yellow); opacity: 0; }
  .is-live .ring { animation: pulse 1.6s var(--ease) infinite; }
  .is-live .ring:nth-child(2) { animation-delay: .55s; }
  @keyframes pulse {
    0%   { transform: scale(1);    opacity: .5; }
    70%  { transform: scale(1.55); opacity: 0; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  .hint { font: 600 12px/1 'Manrope', sans-serif; color: var(--muted); }

  /* ---- status row ---- */
  .status { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); flex: none; animation: blink 1.6s var(--ease) infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .status .name { font: 700 12px/1 'Manrope', sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  .time { margin-left: auto; font: 700 13px/1 'Manrope', sans-serif; color: var(--body); font-variant-numeric: tabular-nums; }

  /* ---- live waveform (Web Audio driven) ---- */
  .scope {
    height: 88px; background: var(--surface-alt); border: 1px solid var(--rule);
    border-radius: var(--r-card); display: flex; align-items: center; justify-content: center;
    gap: 5px; padding: 0 14px; overflow: hidden;
  }
  .scope i {
    display: block; width: 5px; height: 56px; border-radius: 3px; background: var(--aqua);
    transform: scaleY(.18); transform-origin: center;
    transition: transform .09s linear;
  }
  .scope i:nth-child(3n) { background: var(--ink); }
  .scope i:nth-child(5n) { background: var(--yellow); }
  /* idle shimmer before the mic stream is live */
  .scope.is-idle i { animation: wv 1.1s var(--ease) infinite; transition: none; }
  .scope.is-idle i:nth-child(2n) { animation-delay: .12s; }
  .scope.is-idle i:nth-child(3n) { animation-delay: .26s; }
  .scope.is-idle i:nth-child(5n) { animation-delay: .4s; }
  @keyframes wv { 0%,100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }

  /* ---- review card ---- */
  .card { border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px; background: var(--surface-alt); display: flex; flex-direction: column; gap: 12px; }
  .playRow { display: flex; align-items: center; gap: 10px; }
  .play {
    width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--ink); color: #fff;
    font: 800 12px/1 'Manrope', sans-serif; cursor: pointer; flex: none; display: grid; place-items: center;
    transition: transform .18s var(--ease), background .18s var(--ease);
  }
  .play:hover { background: var(--ink-hover); transform: scale(1.05); }
  .play:active { transform: scale(.93); }
  .bars { flex: 1; display: flex; align-items: center; gap: 3px; height: 34px; }
  .bars i {
    flex: 1; border-radius: 2px; background: #c9d6d5;
    transition: background .2s linear, transform .3s var(--ease);
    transform-origin: center; animation: barIn .4s var(--ease) both;
  }
  .bars i.played { background: var(--aqua); }
  .bars i.cursor { background: var(--ink); }
  @keyframes barIn { from { transform: scaleY(.1); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }

  .btnRow { display: flex; gap: 8px; }
  .ghost {
    flex: 1; text-align: center; font: 700 12px/1 'Manrope', sans-serif; padding: 10px 8px;
    border-radius: 7px; border: 1px solid #dfe4e3; background: #fff; color: var(--ink); cursor: pointer;
    transition: background .18s var(--ease), border-color .18s var(--ease), transform .12s var(--ease);
  }
  .ghost:hover { background: #f4faf9; border-color: var(--aqua); }
  .ghost:active { transform: scale(.98); }

  .radios { display: flex; flex-direction: column; gap: 10px; }
  .radio { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; }
  .radio .box { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; flex: none; }
  .radio .box b { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); transform: scale(0); transition: transform .2s var(--ease); }
  .radio input { position: absolute; opacity: 0; pointer-events: none; }
  .radio input:checked + .box b { transform: scale(1); }

  .primary {
    margin-top: auto; width: 100%; border: 0; border-radius: var(--r-btn); background: var(--ink); color: #fff;
    font: 700 13px/1 'Manrope', sans-serif; padding: 13px; cursor: pointer;
    transition: background .18s var(--ease), transform .12s var(--ease);
  }
  .primary:hover { background: var(--ink-hover); }
  .primary:active { transform: scale(.985); }
  .primary[disabled] { opacity: .55; cursor: progress; }

  .upload {
    display: flex; align-items: center; gap: 10px; border: 1px dashed #cfd8d7; border-radius: var(--r-btn);
    padding: 12px; cursor: pointer; background: var(--surface-alt);
    transition: background .18s var(--ease), border-color .18s var(--ease);
  }
  .upload:hover { border-color: var(--aqua); background: #f4faf9; }
  .upload .ico { width: 26px; height: 26px; border-radius: 6px; background: var(--aqua-tint); color: var(--aqua-deep); font: 800 13px/1 'Manrope', sans-serif; display: grid; place-items: center; flex: none; }

  .toast {
    display: flex; align-items: center; gap: 10px; background: var(--aqua-tint);
    border-radius: var(--r-btn); padding: 11px 12px; color: #24534f; font-weight: 600; font-size: 12px;
    animation: toastIn .4s var(--ease) both;
  }
  .toast .tick { width: 20px; height: 20px; border-radius: 50%; background: var(--aqua-deep); color: #fff; font: 800 11px/1 'Manrope', sans-serif; display: grid; place-items: center; flex: none; animation: tick .45s .1s var(--ease) both; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @keyframes tick { from { transform: scale(0) rotate(-25deg); } to { transform: scale(1) rotate(0); } }

  .clip { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: var(--r-btn); padding: 10px 12px; animation: panelIn .3s var(--ease) both; }
  .clip .n { width: 26px; height: 26px; border-radius: 6px; background: var(--ink); color: #fff; font: 800 10px/1 'Manrope', sans-serif; display: grid; place-items: center; flex: none; }
  .clip .meta { min-width: 0; }
  .clip .meta b { display: block; font-size: 13px; }
  .clip .meta span { font-size: 11px; color: var(--muted); }
  .clip .more { margin-left: auto; color: #9aa0a6; cursor: pointer; }

  .err { font-size: 12px; color: #8a4b2f; background: #fdf3e7; border-radius: var(--r-btn); padding: 10px 12px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="mark" src="https://placehold.co/44x44/283e49/ffce32?text=%E2%97%8F" alt="" />
    <h1>Audio Recorder</h1>
  </header>

  <main>
    <!-- IDLE -->
    <section class="panel" data-panel="idle" data-active>
      <p class="lead" style="margin:0">Records to the slide you have open. Audio is saved to your Drive and inserted as a playable clip.</p>
      <div class="recWrap">
        <div class="recStack" id="stack">
          <span class="ring"></span><span class="ring"></span>
          <button class="recBtn" id="recBtn" aria-label="Start recording"><span class="glyph"></span></button>
        </div>
        <div class="hint" id="hint">Tap to record</div>
      </div>
      <div class="rule"></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="label">Or</div>
        <label class="upload">
          <span class="ico">↑</span>
          <span style="font-weight:600">Upload an audio file</span>
          <input type="file" accept="audio/*" id="file" hidden />
        </label>
      </div>
      <div class="err" id="err" hidden></div>
    </section>

    <!-- RECORDING -->
    <section class="panel" data-panel="rec">
      <div class="status">
        <span class="dot"></span><span class="name">Recording</span><span class="time" id="clock">0:00</span>
      </div>
      <div class="scope is-idle" id="scope"></div>
      <div class="recWrap">
        <div class="recStack is-live">
          <span class="ring"></span><span class="ring"></span>
          <button class="recBtn is-recording" id="stopBtn" aria-label="Stop recording"><span class="glyph"></span></button>
        </div>
        <div class="hint">Tap to stop</div>
      </div>
    </section>

    <!-- REVIEW -->
    <section class="panel" data-panel="review">
      <div class="label">Review</div>
      <div class="card">
        <div class="playRow">
          <button class="play" id="playBtn" aria-label="Play">▶</button>
          <div class="bars" id="bars"></div>
          <span class="time" id="dur" style="margin:0;font-size:11px">0:00</span>
        </div>
        <div class="btnRow">
          <button class="ghost" id="again">Re-record</button>
          <button class="ghost" id="trim">Trim</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="label">Playback on slide</div>
        <div class="radios">
          <label class="radio"><input type="radio" name="mode" value="auto" /><span class="box"><b></b></span>Play automatically</label>
          <label class="radio"><input type="radio" name="mode" value="click" checked /><span class="box"><b></b></span>Play on click</label>
        </div>
      </div>
      <button class="primary" id="insert">Insert into current slide</button>
    </section>

    <!-- INSERTED -->
    <section class="panel" data-panel="done">
      <div class="toast"><span class="tick">✓</span><span id="doneMsg">Inserted into the current slide</span></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="label">Clips in this deck</div>
        <div id="clips" style="display:flex;flex-direction:column;gap:8px"></div>
      </div>
      <button class="ghost" id="another" style="margin-top:auto;padding:13px">Record another clip</button>
    </section>
  </main>

  <footer>Initio Audio Recorder · v1.0</footer>
</div>

<script>
(function () {
  var BARS_LIVE = 12, BARS_REVIEW = 24;
  var panels = {};
  document.querySelectorAll('.panel').forEach(function (p) { panels[p.dataset.panel] = p; });

  function show(name) {
    Object.keys(panels).forEach(function (k) {
      if (k === name) panels[k].setAttribute('data-active', ''); else panels[k].removeAttribute('data-active');
    });
  }
  function fmt(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function fail(msg) { var e = document.getElementById('err'); e.textContent = msg; e.hidden = false; }

  // live scope bars
  var scope = document.getElementById('scope');
  for (var i = 0; i < BARS_LIVE; i++) scope.appendChild(document.createElement('i'));
  var liveBars = scope.querySelectorAll('i');

  var media, chunks = [], startedAt = 0, ticker, raf, audioCtx, analyser, blob, audioEl, peaks = [];

  document.getElementById('recBtn').addEventListener('click', start);
  document.getElementById('stopBtn').addEventListener('click', stop);
  document.getElementById('again').addEventListener('click', reset);
  document.getElementById('another').addEventListener('click', reset);
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('insert').addEventListener('click', insert);
  document.getElementById('file').addEventListener('change', function (e) {
    if (e.target.files[0]) { blob = e.target.files[0]; toReview(); }
  });

  function start() {
    if (!navigator.mediaDevices) return fail('This browser cannot record audio. Upload a file instead.');
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      chunks = [];
      media = new MediaRecorder(stream);
      media.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      media.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        blob = new Blob(chunks, { type: media.mimeType || 'audio/webm' });
        toReview();
      };
      media.start();
      startedAt = Date.now();
      show('rec');
      tick();
      ticker = setInterval(tick, 250);
      meter(stream);
    }).catch(function () {
      fail('Microphone access was blocked. Allow it in your browser, then try again.');
    });
  }

  function tick() { document.getElementById('clock').textContent = fmt((Date.now() - startedAt) / 1000); }

  // Web Audio drives the bar heights — the CSS shimmer is only the pre-stream fallback
  function meter(stream) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      audioCtx.createMediaStreamSource(stream).connect(analyser);
      var data = new Uint8Array(analyser.frequencyBinCount);
      scope.classList.remove('is-idle');
      (function loop() {
        analyser.getByteFrequencyData(data);
        var step = Math.floor(data.length / BARS_LIVE) || 1, sum = 0;
        for (var b = 0; b < BARS_LIVE; b++) {
          var v = 0;
          for (var j = 0; j < step; j++) v = Math.max(v, data[b * step + j] || 0);
          var scale = Math.max(0.14, Math.min(1, v / 190));
          liveBars[b].style.transform = 'scaleY(' + scale.toFixed(3) + ')';
          sum += scale;
        }
        peaks.push(sum / BARS_LIVE);
        raf = requestAnimationFrame(loop);
      })();
    } catch (e) { /* keep the CSS shimmer */ }
  }

  function stop() {
    clearInterval(ticker);
    cancelAnimationFrame(raf);
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    scope.classList.add('is-idle');
    if (media && media.state !== 'inactive') media.stop(); else toReview();
  }

  function toReview() {
    var bars = document.getElementById('bars');
    bars.innerHTML = '';
    var sample = [];
    for (var i = 0; i < BARS_REVIEW; i++) {
      var idx = Math.floor(i / BARS_REVIEW * peaks.length);
      sample.push(peaks.length ? peaks[idx] : 0.3 + Math.random() * 0.6);
    }
    sample.forEach(function (v, i) {
      var b = document.createElement('i');
      b.style.height = Math.round(28 + v * 72) + '%';
      b.style.animationDelay = (i * 14) + 'ms';
      bars.appendChild(b);
    });
    audioEl = new Audio(URL.createObjectURL(blob));
    audioEl.addEventListener('loadedmetadata', function () {
      if (isFinite(audioEl.duration)) document.getElementById('dur').textContent = fmt(audioEl.duration);
    });
    audioEl.addEventListener('timeupdate', paintProgress);
    audioEl.addEventListener('ended', function () {
      document.getElementById('playBtn').textContent = '▶';
      paintProgress();
    });
    show('review');
  }

  function paintProgress() {
    var pct = audioEl && audioEl.duration ? audioEl.currentTime / audioEl.duration : 0;
    var bars = document.getElementById('bars').children;
    var head = Math.floor(pct * bars.length);
    for (var i = 0; i < bars.length; i++) {
      bars[i].className = i < head ? 'played' : (i === head && !audioEl.paused ? 'cursor' : '');
    }
  }

  function togglePlay() {
    var btn = document.getElementById('playBtn');
    if (audioEl.paused) { audioEl.play(); btn.textContent = '❚❚'; } else { audioEl.pause(); btn.textContent = '▶'; }
  }

  function insert() {
    var btn = document.getElementById('insert');
    btn.disabled = true; btn.textContent = 'Inserting…';
    var mode = document.querySelector('input[name=mode]:checked').value;
    var reader = new FileReader();
    reader.onload = function () {
      var base64 = String(reader.result).split(',')[1];
      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false; btn.textContent = 'Insert into current slide';
          document.getElementById('doneMsg').textContent = 'Inserted into slide ' + (res && res.slide ? res.slide : '');
          addClip(res, mode);
          show('done');
        })
        .withFailureHandler(function (e) {
          btn.disabled = false; btn.textContent = 'Insert into current slide';
          fail((e && e.message) || 'Insert failed. Try again.');
          show('idle');
        })
        .insertRecording(base64, blob.type, mode);
    };
    reader.readAsDataURL(blob);
  }

  var clipCount = 0;
  function addClip(res, mode) {
    clipCount++;
    var row = document.createElement('div');
    row.className = 'clip';
    row.innerHTML = '<span class="n">' + clipCount + '</span>' +
      '<span class="meta"><b>Narration</b><span>' + document.getElementById('dur').textContent +
      ' · ' + (mode === 'auto' ? 'plays automatically' : 'plays on click') + '</span></span>' +
      '<span class="more">⋯</span>';
    document.getElementById('clips').appendChild(row);
  }

  function reset() {
    clearInterval(ticker); cancelAnimationFrame(raf);
    if (audioEl) { audioEl.pause(); audioEl = null; }
    blob = null; peaks = []; chunks = [];
    document.getElementById('err').hidden = true;
    document.getElementById('clock').textContent = '0:00';
    document.getElementById('playBtn').textContent = '▶';
    show('idle');
  }

  // standalone fallback so the file can be opened directly in a browser
  if (!window.google || !google.script || !google.script.run) {
    window.google = { script: { run: {
      withSuccessHandler: function (cb) { this._ok = cb; return this; },
      withFailureHandler: function (cb) { this._no = cb; return this; },
      insertRecording: function () { var ok = this._ok; setTimeout(function () { ok({ slide: 1 }); }, 700); }
    } } };
  }
})();
</script>
</body>
</html>
