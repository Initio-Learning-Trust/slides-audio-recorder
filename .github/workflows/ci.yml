name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the generated protocol include is current
        run: |
          node tools/sync-protocol.js
          git diff --exit-code -- apps-script/Protocol.html
      - name: Syntax-check the Apps Script sources
        run: |
          for file in apps-script/*.js recorder/*.js recorder/lib/*.js tools/*.js; do
            node --check "$file"
          done
      - name: Unit tests
        run: node --test "test/*.test.js"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end recording test
        run: node --test "test/e2e/*.e2e.js"
