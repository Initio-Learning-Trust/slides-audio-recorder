<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/*
 * Initio Audio Recorder sidebar.
 *
 * Tokens and component styles follow docs/design/HANDOFF.md. Use the custom
 * properties rather than literals, keep exactly one filled button on screen per
 * state, and note the house rule: no red anywhere. Recording is signalled by the
 * yellow dot and the pulsing yellow ring; the button stays Initio Blue.
 */
:root {
  --ink: #283e49;
  --ink-hover: #1c2e37;
  --aqua: #89ccca;
  --aqua-deep: #2f8f86;
  --aqua-tint: #e9f4f3;
  --yellow: #ffce32;
  --cream: #f4f3ef;
  --surface: #ffffff;
  --surface-alt: #fbfbf9;
  --border: #e6e4dd;
  --rule: #f1f3f4;
  --muted: #8b8a83;
  --body: #5c6a72;
  --warn-ink: #8a4b2f;
  --warn-bg: #fdf3e7;
  --r-btn: 8px;
  --r-card: 10px;
  --pad: 16px;
  --gap: 18px;
  --ease: cubic-bezier(.22,.61,.36,1);
}

* { box-sizing: border-box; }

/*
 * The hidden attribute sets display:none through the UA stylesheet, which any
 * author rule with its own display value silently overrides. Components here
 * are flex, so state them together once rather than remembering per rule.
 */
[hidden] { display: none !important; }


body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font: 500 13px/1.5 'Manrope', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.app { display: flex; flex-direction: column; min-height: 100vh; }

header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px var(--pad); border-bottom: 1px solid var(--rule);
}
header .mark { width: 22px; height: 22px; border-radius: 5px; flex: none; }
header h1 { font: 700 14px/1 'Manrope', sans-serif; letter-spacing: -.01em; margin: 0; }
header .where { margin-left: auto; font: 600 11px/1 'Manrope', sans-serif; color: var(--muted); }

main { flex: 1; padding: 20px var(--pad); display: flex; flex-direction: column; }
footer {
  padding: 10px var(--pad); border-top: 1px solid var(--rule);
  font-size: 10px; color: #9aa0a6; display: flex; gap: 10px; align-items: center;
}
footer a { color: var(--aqua-deep); }

/* ---- state machine: one panel visible, cross-faded ---- */
.panel { display: none; flex-direction: column; gap: var(--gap); flex: 1; }
.panel[data-active] { display: flex; animation: panelIn .34s var(--ease) both; }
@keyframes panelIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.lead { color: var(--body); margin: 0; }
.label { font: 700 11px/1 'Manrope', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.rule { height: 1px; background: var(--rule); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack.tight { gap: 8px; }

/* ---- record button ---- */
.recWrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 0; }
.recStack { position: relative; width: 76px; height: 76px; }
.recBtn {
  position: relative; z-index: 1; width: 76px; height: 76px; border: 0; border-radius: 50%;
  background: var(--ink); cursor: pointer; display: grid; place-items: center;
  box-shadow: 0 6px 18px rgba(40,62,73,.28);
  transition: transform .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease);
}
.recBtn:hover { background: var(--ink-hover); transform: translateY(-1px); box-shadow: 0 9px 22px rgba(40,62,73,.32); }
.recBtn:active { transform: scale(.94); box-shadow: 0 4px 12px rgba(40,62,73,.26); }
.recBtn:focus-visible { outline: 3px solid var(--aqua); outline-offset: 3px; }
.recBtn[disabled] { opacity: .5; cursor: default; box-shadow: none; }
.recBtn .glyph {
  width: 18px; height: 30px; border-radius: 9px; background: #fff;
  transition: width .26s var(--ease), height .26s var(--ease), border-radius .26s var(--ease);
}
.recBtn.is-recording .glyph { width: 24px; height: 24px; border-radius: 5px; }
.ring { position: absolute; inset: 0; border-radius: 50%; background: var(--yellow); opacity: 0; }
.is-live .ring { animation: pulse 1.6s var(--ease) infinite; }
.is-live .ring:nth-child(2) { animation-delay: .55s; }
@keyframes pulse {
  0%   { transform: scale(1);    opacity: .5; }
  70%  { transform: scale(1.55); opacity: 0; }
  100% { transform: scale(1.55); opacity: 0; }
}
.hint { font: 600 12px/1 'Manrope', sans-serif; color: var(--muted); text-align: center; }

/* ---- status row ---- */
.status { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); flex: none; animation: blink 1.6s var(--ease) infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
.status .name { font: 700 12px/1 'Manrope', sans-serif; letter-spacing: .1em; text-transform: uppercase; }
.time { margin-left: auto; font: 700 13px/1 'Manrope', sans-serif; color: var(--body); font-variant-numeric: tabular-nums; }

/* ---- live waveform, driven by levels posted from the recording window ---- */
.scope {
  height: 88px; background: var(--surface-alt); border: 1px solid var(--rule);
  border-radius: var(--r-card); display: flex; align-items: center; justify-content: center;
  gap: 5px; padding: 0 14px; overflow: hidden;
}
.scope i {
  display: block; width: 5px; height: 56px; border-radius: 3px; background: var(--aqua);
  transform: scaleY(.18); transform-origin: center; transition: transform .09s linear;
}
.scope i:nth-child(3n) { background: var(--ink); }
.scope i:nth-child(5n) { background: var(--yellow); }
.scope.is-idle i { animation: wv 1.1s var(--ease) infinite; transition: none; }
.scope.is-idle i:nth-child(2n) { animation-delay: .12s; }
.scope.is-idle i:nth-child(3n) { animation-delay: .26s; }
.scope.is-idle i:nth-child(5n) { animation-delay: .4s; }
@keyframes wv { 0%,100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }

/* ---- review card ---- */
.card {
  border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px;
  background: var(--surface-alt); display: flex; flex-direction: column; gap: 12px;
}
.playRow { display: flex; align-items: center; gap: 10px; }
.play {
  width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--ink); color: #fff;
  font: 800 12px/1 'Manrope', sans-serif; cursor: pointer; flex: none; display: grid; place-items: center;
  transition: transform .18s var(--ease), background .18s var(--ease);
}
.play:hover { background: var(--ink-hover); transform: scale(1.05); }
.play:active { transform: scale(.93); }
.bars { flex: 1; display: flex; align-items: center; gap: 3px; height: 34px; }
.bars i {
  flex: 1; border-radius: 2px; background: #c9d6d5; transform-origin: center;
  transition: background .2s linear, transform .3s var(--ease);
  animation: barIn .4s var(--ease) both;
}
.bars i.played { background: var(--aqua); }
.bars i.cursor { background: var(--ink); }
@keyframes barIn { from { transform: scaleY(.1); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }

/* ---- controls ---- */
.btnRow { display: flex; gap: 8px; }
.ghost {
  flex: 1; text-align: center; font: 700 12px/1 'Manrope', sans-serif; padding: 10px 8px;
  border-radius: 7px; border: 1px solid #dfe4e3; background: #fff; color: var(--ink); cursor: pointer;
  transition: background .18s var(--ease), border-color .18s var(--ease), transform .12s var(--ease);
}
.ghost:hover { background: #f4faf9; border-color: var(--aqua); }
.ghost:active { transform: scale(.98); }
.ghost[disabled] { opacity: .5; cursor: default; }

.primary {
  width: 100%; border: 0; border-radius: var(--r-btn); background: var(--ink); color: #fff;
  font: 700 13px/1 'Manrope', sans-serif; padding: 13px; cursor: pointer;
  transition: background .18s var(--ease), transform .12s var(--ease);
}
.primary.at-end { margin-top: auto; }
.primary:hover { background: var(--ink-hover); }
.primary:active { transform: scale(.985); }
.primary[disabled] { opacity: .55; cursor: progress; }

.radios { display: flex; flex-direction: column; gap: 10px; }
.radio { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; position: relative; }
.radio .box { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; flex: none; }
.radio .box b { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); transform: scale(0); transition: transform .2s var(--ease); }
.radio input { position: absolute; opacity: 0; pointer-events: none; }
.radio input:checked + .box b { transform: scale(1); }
.radio input:focus-visible + .box { outline: 3px solid var(--aqua); outline-offset: 2px; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field input[type="text"], .field select {
  width: 100%; font: 600 13px/1.2 'Manrope', sans-serif; color: var(--ink);
  padding: 9px 10px; border: 1px solid var(--border); border-radius: 7px; background: #fff;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--aqua); box-shadow: 0 0 0 3px var(--aqua-tint); }
.check { display: flex; gap: 9px; align-items: flex-start; font-weight: 600; font-size: 12px; cursor: pointer; }

/* ---- progress ---- */
.track { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.track b { display: block; height: 100%; width: 0; background: var(--aqua-deep); transition: width .2s linear; }

/* ---- notices ---- */
.toast {
  display: flex; align-items: center; gap: 10px; background: var(--aqua-tint);
  border-radius: var(--r-btn); padding: 11px 12px; color: #24534f; font-weight: 600; font-size: 12px;
  animation: toastIn .4s var(--ease) both;
}
.toast .tick {
  width: 20px; height: 20px; border-radius: 50%; background: var(--aqua-deep); color: #fff;
  font: 800 11px/1 'Manrope', sans-serif; display: grid; place-items: center; flex: none;
  animation: tick .45s .1s var(--ease) both;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes tick { from { transform: scale(0) rotate(-25deg); } to { transform: scale(1) rotate(0); } }

.err {
  font-size: 12px; color: var(--warn-ink); background: var(--warn-bg);
  border-radius: var(--r-btn); padding: 10px 12px; animation: panelIn .3s var(--ease) both;
}
.note { font-size: 11px; color: var(--muted); margin: 0; }

/* ---- clip list ---- */
.clip {
  display: flex; align-items: center; gap: 10px; border: 1px solid var(--border);
  border-radius: var(--r-btn); padding: 10px 12px; animation: panelIn .3s var(--ease) both;
}
.clip .n {
  width: 26px; height: 26px; border-radius: 6px; background: var(--ink); color: #fff;
  font: 800 10px/1 'Manrope', sans-serif; display: grid; place-items: center; flex: none;
}
.clip .meta { min-width: 0; flex: 1; }
.clip .meta b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clip .meta span { font-size: 11px; color: var(--muted); }
.clip .acts { display: flex; gap: 2px; flex: none; }
.clip .acts button, .clip .acts a {
  border: 0; background: none; padding: 3px 5px; border-radius: 5px; cursor: pointer;
  font: 700 11px/1 'Manrope', sans-serif; color: var(--aqua-deep); text-decoration: none;
}
.clip .acts button:hover, .clip .acts a:hover { background: var(--aqua-tint); }

/* ---- native-audio instructions ---- */
.howto { border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px; background: var(--surface-alt); }
.howto h2 { font: 800 13px/1.35 'Manrope', sans-serif; margin: 0 0 4px; }
.howto p { margin: 0 0 10px; color: var(--body); font-size: 12px; }
.howto ol { margin: 10px 0 0; padding-left: 18px; font-size: 12px; color: var(--body); }
.howto ol li { margin-bottom: 5px; }
.howto ol li b { color: var(--ink); }
.filename { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
.filename input {
  flex: 1; min-width: 0; font: 600 11px/1.2 'Manrope', sans-serif; color: var(--ink);
  padding: 8px 9px; border: 1px solid var(--border); border-radius: 7px; background: #fff;
}
.filename button { flex: none; padding: 8px 10px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
</style>
