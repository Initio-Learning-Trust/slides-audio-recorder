<style>
:root {
  --fg: #202124;
  --muted: #5f6368;
  --line: #dadce0;
  --accent: #1a73e8;
  --accent-fg: #fff;
  --danger: #d93025;
  --ok: #188038;
  --panel: #f1f3f4;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px 14px 24px;
  font: 13px/1.45 Roboto, Arial, sans-serif;
  color: var(--fg);
  background: #fff;
}

h1 {
  font-size: 14px;
  font-weight: 500;
  margin: 0 0 2px;
}

.slide-line {
  color: var(--muted);
  font-size: 12px;
  margin: 0 0 12px;
}

button {
  font: inherit;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--accent);
  padding: 7px 12px;
  cursor: pointer;
}

button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button[disabled] { opacity: .5; cursor: default; }

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-fg);
  width: 100%;
  padding: 10px 12px;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

button.primary .dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: currentColor; display: inline-block;
}

button.link {
  border: 0;
  background: none;
  padding: 2px 4px;
  color: var(--accent);
}

button.link.danger { color: var(--danger); }

.row { display: flex; gap: 6px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.card {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  margin-top: 12px;
}

.card h2 {
  font-size: 12px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--muted);
  margin: 0 0 8px;
}

label.field { display: block; margin-bottom: 8px; }
label.field > span {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 3px;
}

input[type="text"], select {
  width: 100%;
  font: inherit;
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  color: var(--fg);
}

label.check {
  display: flex;
  gap: 7px;
  align-items: flex-start;
  margin-bottom: 8px;
  font-size: 12px;
}

label.check input { margin: 2px 0 0; }

details { margin-top: 12px; }

details > summary {
  cursor: pointer;
  font-size: 12px;
  color: var(--accent);
  padding: 4px 0;
}

.progress {
  height: 4px;
  border-radius: 2px;
  background: var(--panel);
  overflow: hidden;
  margin-top: 8px;
}

.progress span {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 120ms linear;
}

.status {
  font-size: 12px;
  color: var(--muted);
  margin: 8px 0 0;
}

.notice {
  border-radius: 4px;
  padding: 8px 10px;
  font-size: 12px;
  margin-top: 10px;
}

.notice.error { background: #fce8e6; color: #a50e0e; }
.notice.ok { background: #e6f4ea; color: #137333; }
.notice.info { background: var(--panel); color: var(--fg); }

ul.recordings { list-style: none; margin: 0; padding: 0; }

ul.recordings li {
  border-top: 1px solid var(--line);
  padding: 8px 0;
}

ul.recordings li:first-child { border-top: 0; }

.rec-name {
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rec-meta { font-size: 11px; color: var(--muted); }

.empty { font-size: 12px; color: var(--muted); margin: 0; }

.steps { margin: 6px 0 0; padding-left: 18px; font-size: 12px; }
.steps li { margin-bottom: 3px; }

code {
  background: var(--panel);
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 11px;
  word-break: break-all;
}

a { color: var(--accent); }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
</style>
