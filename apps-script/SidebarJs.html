<script>
/**
 * Sidebar controller.
 *
 * Five panels, one visible at a time: idle -> rec -> review -> done, plus
 * settings. Every state has exactly one primary action.
 *
 * Capture cannot happen here -- Google serves add-on HTML inside a sandboxed
 * iframe with no microphone permission -- so the record button opens a small
 * window on our own origin. That window is a microphone and nothing else: it
 * streams live meter values back so this panel can draw the waveform, and hands
 * over the finished WAV when stopped. Review, insertion and everything the
 * teacher decides happen here.
 */
(function () {
  'use strict';

  var LIVE_BARS = 12;
  var REVIEW_BARS = 24;

  var boot = null;
  var recorderWindow = null;
  var nonce = null;
  var closeWatch = null;
  var clockTimer = null;
  var startedAt = 0;
  var cancelRequested = false;

  /** The recording being reviewed, before it is saved. */
  var take = null;

  /** Peaks streamed from the recording window, used to draw the review bars. */
  var peaks = [];

  var el = {};
  var panels = {};

  // ------------------------------------------------------------ server calls

  /**
   * Promise wrapper around google.script.run.
   * @param {string} name Server function name.
   * @param {...*} args Arguments to pass.
   * @return {!Promise<*>} Resolves with the server's return value.
   */
  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) {
            reject(new Error(err && err.message ? err.message : String(err)));
          })[name].apply(null, args);
    });
  }

  // ------------------------------------------------------------------- utils

  /**
   * @param {string} id Element id.
   * @return {?Element} The element.
   */
  function $(id) {
    return document.getElementById(id);
  }

  /**
   * Switches the visible panel.
   * @param {string} name Panel name.
   */
  function show(name) {
    Object.keys(panels).forEach(function (key) {
      if (key === name) {
        panels[key].setAttribute('data-active', '');
      } else {
        panels[key].removeAttribute('data-active');
      }
    });
  }

  /**
   * @return {string} The panel currently on screen.
   */
  function current() {
    var found = 'idle';
    Object.keys(panels).forEach(function (key) {
      if (panels[key].hasAttribute('data-active')) {
        found = key;
      }
    });
    return found;
  }

  /**
   * Shows an error in the panel the user is looking at.
   * @param {string} message Text, or empty to clear.
   */
  function fail(message) {
    ['idle-err', 'rec-err', 'review-err', 'settings-err'].forEach(function (id) {
      var box = $(id);
      box.hidden = true;
      box.textContent = '';
    });
    if (!message) {
      return;
    }
    var target = { rec: 'rec-err', review: 'review-err', settings: 'settings-err' }[current()] || 'idle-err';
    var box = $(target);
    box.textContent = message;
    box.hidden = false;
  }

  /**
   * @param {number} seconds Duration in seconds.
   * @return {string} m:ss.
   */
  function fmt(seconds) {
    var whole = Math.max(0, Math.round(seconds));
    return Math.floor(whole / 60) + ':' + String(whole % 60).padStart(2, '0');
  }

  /**
   * @param {number} bytes Size in bytes.
   * @return {string} Human-readable size.
   */
  function fmtSize(bytes) {
    if (!bytes) {
      return '';
    }
    return bytes < 1024 * 1024 ?
        Math.round(bytes / 1024) + ' KB' :
        (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  /**
   * Base64-encodes a slice of bytes without blowing the call stack.
   * @param {!Uint8Array} bytes The slice.
   * @return {string} Base64 text.
   */
  function toBase64(bytes) {
    var binary = '';
    var step = 8192;
    for (var i = 0; i < bytes.length; i += step) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    }
    return btoa(binary);
  }

  /**
   * @return {string} A random session nonce.
   */
  function makeNonce() {
    if (window.crypto && window.crypto.randomUUID) {
      return window.crypto.randomUUID();
    }
    var bytes = new Uint8Array(16);
    if (window.crypto && window.crypto.getRandomValues) {
      window.crypto.getRandomValues(bytes);
    } else {
      for (var i = 0; i < bytes.length; i++) {
        bytes[i] = Math.floor(Math.random() * 256);
      }
    }
    return Array.prototype.map.call(bytes, function (b) {
      return ('0' + b.toString(16)).slice(-2);
    }).join('');
  }

  // ------------------------------------------------------- recording window

  /** Opens (or refocuses) the recording window. */
  function openRecorder() {
    fail('');
    if (recorderWindow && !recorderWindow.closed) {
      recorderWindow.focus();
      return;
    }
    nonce = makeNonce();
    var url = SarProtocol.buildLaunchUrl(boot.recorderUrl, {
      origin: window.location.origin,
      nonce: nonce,
      sampleRate: boot.settings.sampleRate,
      maxBytes: boot.maxBytes,
      label: el.optLabel.value.trim(),
      slide: boot.slide && boot.slide.number ? String(boot.slide.number) : ''
    });

    var width = 420;
    var height = 460;
    var left = Math.max(0, (window.screen.availWidth || 1200) - width - 60);
    var top = Math.max(0, Math.round(((window.screen.availHeight || 800) - height) / 2));
    recorderWindow = window.open(url, 'initioAudioRecorder',
        'popup=yes,width=' + width + ',height=' + height + ',left=' + left + ',top=' + top +
        ',menubar=no,toolbar=no,location=no,status=no');

    if (!recorderWindow) {
      fail('Your browser blocked the recording window. Allow pop-ups for docs.google.com, then tap ' +
           'the record button again.');
      return;
    }
    el.idleHint.textContent = 'Allow the microphone in the window that opened';
    watchForClose();
  }

  /** Resets the sidebar if the recording window disappears mid-flow. */
  function watchForClose() {
    clearInterval(closeWatch);
    closeWatch = setInterval(function () {
      if (recorderWindow && !recorderWindow.closed) {
        return;
      }
      clearInterval(closeWatch);
      closeWatch = null;
      recorderWindow = null;
      nonce = null;
      if (current() === 'rec') {
        stopClock();
        show('idle');
        fail('The recording window closed before the recording finished.');
      }
      el.idleHint.textContent = 'Tap to record';
    }, 1000);
  }

  /**
   * @param {string} type Protocol message type.
   * @param {Object=} payload Extra fields.
   */
  function postToRecorder(type, payload) {
    if (recorderWindow && !recorderWindow.closed && nonce) {
      recorderWindow.postMessage(SarProtocol.envelope(type, nonce, payload), boot.recorderOrigin);
    }
  }

  /**
   * Handles messages from the recording window.
   * @param {!MessageEvent} event The message event.
   */
  function onMessage(event) {
    var data = SarProtocol.accept(event, boot.recorderOrigin, nonce);
    if (!data) {
      return;
    }
    if (data.type === SarProtocol.TYPES.READY) {
      postToRecorder(SarProtocol.TYPES.ACK, {});
      return;
    }
    if (data.type === SarProtocol.TYPES.STATE) {
      if (data.state === 'recording') {
        beginRecordingState();
      }
      return;
    }
    if (data.type === SarProtocol.TYPES.LEVELS) {
      paintLive(data.values || []);
      return;
    }
    if (data.type === SarProtocol.TYPES.AUDIO) {
      toReview(data);
      return;
    }
    if (data.type === SarProtocol.TYPES.CLOSING && current() === 'rec') {
      stopClock();
      show('idle');
    }
  }

  // ------------------------------------------------------------- rec panel

  /** Moves to the recording panel and starts the clock. */
  function beginRecordingState() {
    fail('');
    peaks = [];
    el.scope.classList.add('is-idle');
    startedAt = Date.now();
    tick();
    clearInterval(clockTimer);
    clockTimer = setInterval(tick, 250);
    show('rec');
  }

  /** Updates the elapsed time. */
  function tick() {
    el.clock.textContent = fmt((Date.now() - startedAt) / 1000);
  }

  /** Stops the elapsed-time ticker. */
  function stopClock() {
    clearInterval(clockTimer);
    clockTimer = null;
  }

  /**
   * Draws the live waveform from values sent by the recording window.
   * @param {!Array<number>} values One value per bar, each 0..1.
   */
  function paintLive(values) {
    if (!values.length) {
      return;
    }
    el.scope.classList.remove('is-idle');
    var sum = 0;
    for (var i = 0; i < el.liveBars.length; i++) {
      var value = Math.max(0.14, Math.min(1, values[i] || 0));
      el.liveBars[i].style.transform = 'scaleY(' + value.toFixed(3) + ')';
      sum += value;
    }
    peaks.push(sum / el.liveBars.length);
  }

  // ---------------------------------------------------------- review panel

  /**
   * Receives a finished recording and moves to review.
   * @param {{buffer: !ArrayBuffer, sampleRate: number, durationMs: number}} data The audio message.
   */
  function toReview(data) {
    stopClock();
    el.scope.classList.add('is-idle');

    if (take && take.url) {
      URL.revokeObjectURL(take.url);
    }
    var blob = new Blob([data.buffer], { type: 'audio/wav' });
    take = {
      bytes: new Uint8Array(data.buffer),
      sampleRate: data.sampleRate,
      durationMs: data.durationMs,
      url: URL.createObjectURL(blob),
      audio: new Audio()
    };
    take.audio.src = take.url;
    take.audio.addEventListener('timeupdate', paintProgress);
    take.audio.addEventListener('ended', function () {
      el.btnPlay.innerHTML = '&#9654;';
      paintProgress();
    });

    el.dur.textContent = fmt(data.durationMs / 1000);
    drawReviewBars();
    el.btnInsert.disabled = false;
    el.btnInsert.textContent = 'Insert into current slide';
    el.track.hidden = true;
    el.saveNote.hidden = true;
    show('review');
    el.optLabel.focus();
  }

  /** Builds the review waveform from the peaks captured while recording. */
  function drawReviewBars() {
    el.bars.innerHTML = '';
    for (var i = 0; i < REVIEW_BARS; i++) {
      var value;
      if (peaks.length) {
        value = peaks[Math.floor(i / REVIEW_BARS * peaks.length)] || 0.2;
      } else {
        value = 0.3 + Math.random() * 0.6;
      }
      var bar = document.createElement('i');
      bar.style.height = Math.round(28 + value * 72) + '%';
      bar.style.animationDelay = (i * 14) + 'ms';
      el.bars.appendChild(bar);
    }
  }

  /** Colours the review bars up to the playhead. */
  function paintProgress() {
    var audio = take && take.audio;
    var fraction = audio && audio.duration ? audio.currentTime / audio.duration : 0;
    var bars = el.bars.children;
    var head = Math.floor(fraction * bars.length);
    for (var i = 0; i < bars.length; i++) {
      bars[i].className = i < head ? 'played' : (i === head && audio && !audio.paused ? 'cursor' : '');
    }
  }

  /** Plays or pauses the take. */
  function togglePlay() {
    if (!take) {
      return;
    }
    if (take.audio.paused) {
      take.audio.play();
      el.btnPlay.innerHTML = '&#10074;&#10074;';
    } else {
      take.audio.pause();
      el.btnPlay.innerHTML = '&#9654;';
    }
  }

  /** Discards the take and reopens the recording window. */
  function reRecord() {
    discardTake();
    openRecorder();
  }

  /** Releases the current take. */
  function discardTake() {
    if (take) {
      take.audio.pause();
      URL.revokeObjectURL(take.url);
      take = null;
    }
    peaks = [];
    el.btnPlay.innerHTML = '&#9654;';
  }

  // ---------------------------------------------------------------- saving

  /**
   * Saves the take to Drive and puts a play control on the slide.
   * @return {!Promise<void>}
   */
  function saveAndInsert() {
    if (!take) {
      return Promise.resolve();
    }
    var label = el.optLabel.value.trim();
    var style = document.querySelector('input[name=style]:checked').value;

    cancelRequested = false;
    fail('');
    el.btnInsert.disabled = true;
    el.btnInsert.textContent = 'Saving…';
    el.track.hidden = false;
    el.saveNote.hidden = false;
    el.saveNote.textContent = 'Saving to your Drive…';
    progress(0);

    return call('beginUpload', {
      totalBytes: take.bytes.length,
      durationMs: take.durationMs,
      sampleRate: take.sampleRate,
      label: label,
      slideObjectId: null
    }).then(function (session) {
      return pushChunks(session, take.bytes);
    }).then(function (recording) {
      postToRecorder(SarProtocol.TYPES.ACCEPTED, {});
      el.btnInsert.textContent = 'Inserting…';
      el.saveNote.textContent = 'Adding the play button…';
      progress(1);
      return call('insertRecording', recording.fileId, {
        style: style,
        label: label,
        position: boot.settings.chipPosition,
        addToSpeakerNotes: boot.settings.addToSpeakerNotes,
        slideObjectId: null
      }).then(function (result) {
        return finishInsert(recording, result);
      });
    }).catch(function (err) {
      var message = err && err.message ? err.message : 'The recording could not be saved.';
      postToRecorder(SarProtocol.TYPES.REJECTED, { message: message });
      el.btnInsert.disabled = false;
      el.btnInsert.textContent = 'Insert into current slide';
      el.track.hidden = true;
      el.saveNote.hidden = true;
      fail(message);
    });
  }

  /**
   * Streams the recording to the server one chunk at a time.
   * @param {{uploadId: string, chunkBytes: number}} session Upload session.
   * @param {!Uint8Array} bytes The whole file.
   * @return {!Promise<Object>} Resolves with the finished recording record.
   */
  function pushChunks(session, bytes) {
    var index = 0;
    var total = bytes.length;

    function next() {
      if (cancelRequested) {
        return call('abortUpload', session.uploadId).then(function () {
          throw new Error('Saving was cancelled.');
        });
      }
      var start = index * session.chunkBytes;
      var slice = bytes.subarray(start, Math.min(start + session.chunkBytes, total));
      return call('pushChunk', session.uploadId, index, toBase64(slice)).then(function (result) {
        progress(result.offset / total);
        if (result.done) {
          return result.recording;
        }
        index++;
        return next();
      });
    }

    return next();
  }

  /**
   * @param {number} fraction Progress in [0, 1].
   */
  function progress(fraction) {
    el.trackFill.style.width = Math.round(Math.min(1, Math.max(0, fraction)) * 100) + '%';
  }

  /**
   * Moves to the done panel once a recording is on the slide.
   * @param {Object} recording The saved recording.
   * @param {{slideNumber: number}} result Where it was inserted.
   * @return {!Promise<void>}
   */
  function finishInsert(recording, result) {
    discardTake();
    boot.recordings.unshift(recording);
    if (recording.folderId && !boot.folderUrl) {
      boot.folderUrl = 'https://drive.google.com/drive/folders/' + recording.folderId;
    }
    renderClips();
    updateHowTo(recording);
    el.doneMsg.textContent = 'Added to slide ' + result.slideNumber;
    show('done');
    return refreshSlide();
  }

  // ------------------------------------------------------------------ done

  /**
   * Fills in the native-audio instructions for the newest recording.
   * @param {Object} recording The recording to name.
   */
  function updateHowTo(recording) {
    if (!recording) {
      return;
    }
    el.nativeName.value = recording.name;
    el.demoFile.textContent = recording.name;
    el.nativePath.textContent = 'Saved in My Drive › Slides Audio Recorder › ' +
        (boot.presentation ? boot.presentation.name : 'this presentation');
  }

  /**
   * Copies the file name so it can be pasted into the Insert > Audio search box.
   *
   * The clipboard API is unreliable inside the add-on's sandboxed iframe, so
   * this selects the text and falls back to asking for the keyboard shortcut.
   */
  function copyFileName() {
    el.nativeName.focus();
    el.nativeName.select();
    var copied = false;
    try {
      copied = document.execCommand('copy');
    } catch (err) {
      copied = false;
    }
    el.btnCopyName.textContent = copied ? 'Copied' : 'Press Ctrl+C';
    setTimeout(function () {
      el.btnCopyName.textContent = 'Copy';
    }, 2500);
  }

  // ------------------------------------------------------------ clip list

  /** Redraws the clip list in both the idle and done panels. */
  function renderClips() {
    var items = boot.recordings || [];
    el.idleClipsWrap.hidden = items.length === 0;
    [el.idleClips, el.doneClips].forEach(function (host) {
      host.innerHTML = '';
      items.forEach(function (recording, index) {
        host.appendChild(clipRow(recording, items.length - index));
      });
    });
  }

  /**
   * @param {Object} recording The recording.
   * @param {number} number Display number.
   * @return {!Element} A clip row.
   */
  function clipRow(recording, number) {
    var row = document.createElement('div');
    row.className = 'clip';

    var badge = document.createElement('span');
    badge.className = 'n';
    badge.textContent = String(number);
    row.appendChild(badge);

    var meta = document.createElement('span');
    meta.className = 'meta';
    var name = document.createElement('b');
    name.textContent = recording.label || recording.name;
    name.title = recording.name;
    var sub = document.createElement('span');
    sub.textContent = [
      fmt((recording.durationMs || 0) / 1000),
      fmtSize(recording.sizeBytes),
      sharingWord(recording.sharing)
    ].filter(Boolean).join(' · ');
    meta.appendChild(name);
    meta.appendChild(sub);
    row.appendChild(meta);

    var acts = document.createElement('span');
    acts.className = 'acts';
    acts.appendChild(action('Add', function () {
      insertExisting(recording);
    }));
    var play = document.createElement('a');
    play.textContent = 'Play';
    play.href = recording.url;
    play.target = '_blank';
    play.rel = 'noopener';
    acts.appendChild(play);
    acts.appendChild(action('Delete', function () {
      removeClip(recording);
    }));
    row.appendChild(acts);

    return row;
  }

  /**
   * @param {string} text Button label.
   * @param {!Function} handler Click handler.
   * @return {!Element} The button.
   */
  function action(text, handler) {
    var button = document.createElement('button');
    button.type = 'button';
    button.textContent = text;
    button.addEventListener('click', handler);
    return button;
  }

  /**
   * @param {string} mode Sharing mode.
   * @return {string} Short description.
   */
  function sharingWord(mode) {
    return { anyone: 'anyone with link', domain: 'your organisation', private: 'private' }[mode] || '';
  }

  /**
   * Puts an existing recording on the current slide.
   * @param {Object} recording The recording.
   */
  function insertExisting(recording) {
    fail('');
    call('insertRecording', recording.fileId, {
      style: document.querySelector('input[name=style]:checked').value,
      label: recording.label,
      position: boot.settings.chipPosition,
      addToSpeakerNotes: boot.settings.addToSpeakerNotes,
      slideObjectId: null
    }).then(function (result) {
      el.doneMsg.textContent = 'Added to slide ' + result.slideNumber;
      updateHowTo(recording);
      show('done');
      return refreshSlide();
    }).catch(function (err) {
      fail(err.message);
    });
  }

  /**
   * Moves a recording to the Drive bin.
   * @param {Object} recording The recording.
   */
  function removeClip(recording) {
    if (!window.confirm('Move this recording to the Drive bin? Any play buttons already on your ' +
        'slides will stop working.')) {
      return;
    }
    call('deleteRecording', recording.fileId).then(function (updated) {
      boot.recordings = updated;
      renderClips();
    }).catch(function (err) {
      fail(err.message);
    });
  }

  // --------------------------------------------------------------- context

  /**
   * Refreshes the "Slide n of m" line in the header.
   * @return {!Promise<void>}
   */
  function refreshSlide() {
    return call('describeCurrentSlide').then(function (slide) {
      boot.slide = slide;
      el.where.textContent = slide && slide.number ? 'Slide ' + slide.number + ' of ' + slide.total : '';
    }).catch(function () {
      // Not fatal: the server falls back to the first slide when inserting.
    });
  }

  // -------------------------------------------------------------- settings

  /** Copies settings into the form controls. */
  function applySettings() {
    var s = boot.settings;
    el.optLabel.value = s.chipLabel;
    var radio = document.querySelector('input[name=style][value="' + s.chipStyle + '"]');
    if (radio) {
      radio.checked = true;
    }
    el.setRate.value = String(s.sampleRate);
    el.setSharing.value = s.sharing;
    el.setPosition.value = s.chipPosition;
    el.setNotes.checked = s.addToSpeakerNotes;
  }

  /**
   * Persists the settings form.
   * @return {!Promise<void>}
   */
  function saveSettings() {
    el.btnSaveSettings.disabled = true;
    return call('saveSettings', {
      sampleRate: Number(el.setRate.value),
      sharing: el.setSharing.value,
      chipPosition: el.setPosition.value,
      addToSpeakerNotes: el.setNotes.checked,
      chipStyle: document.querySelector('input[name=style]:checked').value,
      chipLabel: el.optLabel.value.trim()
    }).then(function (saved) {
      boot.settings = saved;
      applySettings();
      show('idle');
    }).catch(function (err) {
      fail(err.message);
    }).then(function () {
      el.btnSaveSettings.disabled = false;
    });
  }

  // ------------------------------------------------------------------ init

  /** Caches element references. */
  function cacheElements() {
    el = {
      mark: $('mark'),
      title: $('title'),
      where: $('where'),
      version: $('version'),
      linkHelp: $('link-help'),
      linkSettings: $('link-settings'),
      btnRecord: $('btn-record'),
      idleHint: $('idle-hint'),
      idleClipsWrap: $('idle-clips-wrap'),
      idleClips: $('idle-clips'),
      scope: $('scope'),
      clock: $('clock'),
      btnStop: $('btn-stop'),
      bars: $('bars'),
      dur: $('dur'),
      btnPlay: $('btn-play'),
      btnAgain: $('btn-again'),
      optLabel: $('opt-label'),
      btnInsert: $('btn-insert'),
      track: $('track'),
      trackFill: $('track-fill'),
      saveNote: $('save-note'),
      doneMsg: $('done-msg'),
      demo: $('demo'),
      demoFile: $('demo-file'),
      nativeName: $('native-name'),
      btnCopyName: $('btn-copy-name'),
      nativePath: $('native-path'),
      doneClips: $('done-clips'),
      btnAnother: $('btn-another'),
      setRate: $('set-rate'),
      setSharing: $('set-sharing'),
      setPosition: $('set-position'),
      setNotes: $('set-notes'),
      btnSaveSettings: $('btn-save-settings'),
      btnSettingsBack: $('btn-settings-back'),
      btnFolderOpen: $('btn-folder-open')
    };
    document.querySelectorAll('.panel').forEach(function (panel) {
      panels[panel.dataset.panel] = panel;
    });
    for (var i = 0; i < LIVE_BARS; i++) {
      el.scope.appendChild(document.createElement('i'));
    }
    el.liveBars = el.scope.querySelectorAll('i');
  }

  /**
   * Swaps the CSS demo for a supplied animation when one is configured.
   * @param {string} url Animation URL from the HOWTO_ANIMATION_URL property.
   */
  function useSuppliedAnimation(url) {
    var isVideo = /\.(mp4|webm|ogv)(\?|$)/i.test(url);
    var node = document.createElement(isVideo ? 'video' : 'img');
    node.src = url;
    if (isVideo) {
      node.autoplay = true;
      node.loop = true;
      node.muted = true;
      node.playsInline = true;
    } else {
      node.alt = 'How to insert audio: Insert, then Audio, then choose the file';
    }
    el.demo.innerHTML = '';
    el.demo.appendChild(node);
  }

  /** Wires the UI and loads state from the server. */
  function init() {
    cacheElements();

    el.btnRecord.addEventListener('click', openRecorder);
    el.btnStop.addEventListener('click', function () {
      postToRecorder(SarProtocol.TYPES.STOP, {});
    });
    el.btnPlay.addEventListener('click', togglePlay);
    el.btnAgain.addEventListener('click', reRecord);
    el.btnInsert.addEventListener('click', saveAndInsert);
    el.btnAnother.addEventListener('click', function () {
      show('idle');
      el.idleHint.textContent = 'Tap to record';
    });
    el.btnCopyName.addEventListener('click', copyFileName);
    el.btnSaveSettings.addEventListener('click', saveSettings);
    el.btnSettingsBack.addEventListener('click', function () {
      show('idle');
    });
    el.linkSettings.addEventListener('click', function (event) {
      event.preventDefault();
      show('settings');
    });
    el.optLabel.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        saveAndInsert();
      }
    });
    window.addEventListener('message', onMessage);

    call('getBootstrap').then(function (data) {
      boot = data;
      el.mark.src = BRAND_ICON;
      el.title.textContent = boot.addonName;
      el.version.textContent = boot.addonName + ' · v' + boot.version;
      el.linkHelp.href = boot.supportUrl;
      if (boot.folderUrl) {
        el.btnFolderOpen.hidden = false;
        el.btnFolderOpen.addEventListener('click', function () {
          window.open(boot.folderUrl, '_blank', 'noopener');
        });
      }
      if (boot.howtoAnimationUrl) {
        useSuppliedAnimation(boot.howtoAnimationUrl);
      }
      applySettings();
      renderClips();
      if (boot.recordings && boot.recordings.length) {
        updateHowTo(boot.recordings[0]);
      }
      el.where.textContent = boot.slide && boot.slide.number ?
          'Slide ' + boot.slide.number + ' of ' + boot.slide.total : '';
      el.btnRecord.disabled = false;
    }).catch(function (err) {
      fail('The add-on could not start: ' + err.message);
    });
  }

  init();
}());
</script>
