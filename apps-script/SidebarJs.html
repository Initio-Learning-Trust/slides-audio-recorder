<script>
/**
 * Sidebar controller.
 *
 * Five panels, one visible at a time: idle -> rec -> saving -> done, plus
 * settings. Every state has exactly one primary action.
 *
 * Capture cannot happen here -- Google serves add-on HTML inside a sandboxed
 * iframe with no microphone permission -- so the record button opens a small
 * window on our own origin. That window records, plays the take back and takes
 * its name; this panel mirrors the live waveform while it runs, saves the
 * finished audio to Drive, and then shows the teacher how to place it with
 * Insert > Audio. Nothing is added to the slide by the add-on: the Slides API
 * has no audio element, and a linked shape would only compete with the real
 * one.
 */
(function () {
  'use strict';

  var LIVE_BARS = 12;

  var boot = null;
  var recorderWindow = null;
  var nonce = null;
  var closeWatch = null;
  var clockTimer = null;
  var startedAt = 0;

  var el = {};
  var panels = {};

  // ------------------------------------------------------------ server calls

  /**
   * Promise wrapper around google.script.run.
   * @param {string} name Server function name.
   * @param {...*} args Arguments to pass.
   * @return {!Promise<*>} Resolves with the server's return value.
   */
  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) {
            reject(new Error(err && err.message ? err.message : String(err)));
          })[name].apply(null, args);
    });
  }

  // ------------------------------------------------------------------- utils

  /**
   * @param {string} id Element id.
   * @return {?Element} The element.
   */
  function $(id) {
    return document.getElementById(id);
  }

  /**
   * Switches the visible panel.
   * @param {string} name Panel name.
   */
  function show(name) {
    Object.keys(panels).forEach(function (key) {
      if (key === name) {
        panels[key].setAttribute('data-active', '');
      } else {
        panels[key].removeAttribute('data-active');
      }
    });
  }

  /**
   * @return {string} The panel currently on screen.
   */
  function current() {
    var found = 'idle';
    Object.keys(panels).forEach(function (key) {
      if (panels[key].hasAttribute('data-active')) {
        found = key;
      }
    });
    return found;
  }

  /**
   * Shows an error in the panel the user is looking at.
   * @param {string} message Text, or empty to clear.
   */
  function fail(message) {
    ['loading-err', 'idle-err', 'rec-err', 'saving-err', 'settings-err'].forEach(function (id) {
      var box = $(id);
      box.hidden = true;
      box.textContent = '';
    });
    if (!message) {
      return;
    }
    var target = { loading: 'loading-err', rec: 'rec-err', saving: 'saving-err',
      settings: 'settings-err' }[current()] || 'idle-err';
    var box = $(target);
    box.textContent = message;
    box.hidden = false;
  }

  /**
   * @param {number} seconds Duration in seconds.
   * @return {string} m:ss.
   */
  function fmt(seconds) {
    var whole = Math.max(0, Math.round(seconds));
    return Math.floor(whole / 60) + ':' + String(whole % 60).padStart(2, '0');
  }

  /**
   * @param {number} bytes Size in bytes.
   * @return {string} Human-readable size.
   */
  function fmtSize(bytes) {
    if (!bytes) {
      return '';
    }
    return bytes < 1024 * 1024 ?
        Math.round(bytes / 1024) + ' KB' :
        (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  /**
   * Base64-encodes a slice of bytes without blowing the call stack.
   * @param {!Uint8Array} bytes The slice.
   * @return {string} Base64 text.
   */
  function toBase64(bytes) {
    var binary = '';
    var step = 8192;
    for (var i = 0; i < bytes.length; i += step) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    }
    return btoa(binary);
  }

  /**
   * @return {string} A random session nonce.
   */
  function makeNonce() {
    if (window.crypto && window.crypto.randomUUID) {
      return window.crypto.randomUUID();
    }
    var bytes = new Uint8Array(16);
    if (window.crypto && window.crypto.getRandomValues) {
      window.crypto.getRandomValues(bytes);
    } else {
      for (var i = 0; i < bytes.length; i++) {
        bytes[i] = Math.floor(Math.random() * 256);
      }
    }
    return Array.prototype.map.call(bytes, function (b) {
      return ('0' + b.toString(16)).slice(-2);
    }).join('');
  }

  // ------------------------------------------------------- recording window

  /** Opens (or refocuses) the recording window. */
  function openRecorder() {
    fail('');
    if (recorderWindow && !recorderWindow.closed) {
      recorderWindow.focus();
      return;
    }
    nonce = makeNonce();
    var url = SarProtocol.buildLaunchUrl(boot.recorderUrl, {
      origin: window.location.origin,
      nonce: nonce,
      sampleRate: boot.settings.sampleRate,
      maxBytes: boot.maxBytes,
      label: '',
      slide: boot.slide && boot.slide.number ? String(boot.slide.number) : ''
    });

    // Close to the 312px sidebar, so the two windows read as one product.
    var width = 360;
    var height = 520;
    var left = Math.max(0, (window.screen.availWidth || 1200) - width - 60);
    var top = Math.max(0, Math.round(((window.screen.availHeight || 800) - height) / 2));
    recorderWindow = window.open(url, 'initioAudioRecorder',
        'popup=yes,width=' + width + ',height=' + height + ',left=' + left + ',top=' + top +
        ',menubar=no,toolbar=no,location=no,status=no');

    if (!recorderWindow) {
      fail('Your browser blocked the recording window. Allow pop-ups for docs.google.com, then tap ' +
           'the record button again.');
      return;
    }
    el.idleHint.textContent = 'Recording in the other window';
    watchForClose();
  }

  /** Resets the sidebar if the recording window disappears mid-flow. */
  function watchForClose() {
    clearInterval(closeWatch);
    closeWatch = setInterval(function () {
      if (recorderWindow && !recorderWindow.closed) {
        return;
      }
      clearInterval(closeWatch);
      closeWatch = null;
      recorderWindow = null;
      nonce = null;
      if (current() === 'rec') {
        stopClock();
        show('idle');
        fail('The recording window closed before the recording finished.');
      }
      el.idleHint.textContent = 'Tap to record';
    }, 1000);
  }

  /**
   * @param {string} type Protocol message type.
   * @param {Object=} payload Extra fields.
   */
  function postToRecorder(type, payload) {
    if (recorderWindow && !recorderWindow.closed && nonce) {
      recorderWindow.postMessage(SarProtocol.envelope(type, nonce, payload), boot.recorderOrigin);
    }
  }

  /**
   * Handles messages from the recording window.
   * @param {!MessageEvent} event The message event.
   */
  function onMessage(event) {
    var data = SarProtocol.accept(event, boot.recorderOrigin, nonce);
    if (!data) {
      return;
    }
    if (data.type === SarProtocol.TYPES.READY) {
      postToRecorder(SarProtocol.TYPES.ACK, {});
      return;
    }
    if (data.type === SarProtocol.TYPES.STATE) {
      if (data.state === 'recording') {
        beginRecordingState();
      } else if (data.state === 'review' && current() === 'rec') {
        // The teacher is naming the take in the other window.
        stopClock();
        show('idle');
        el.idleHint.textContent = 'Finishing in the other window';
      }
      return;
    }
    if (data.type === SarProtocol.TYPES.LEVELS) {
      paintLive(data.values || []);
      return;
    }
    if (data.type === SarProtocol.TYPES.AUDIO) {
      saveRecording(data);
      return;
    }
    if (data.type === SarProtocol.TYPES.CLOSING && current() === 'rec') {
      stopClock();
      show('idle');
    }
  }

  // ------------------------------------------------------------- rec panel

  /** Moves to the recording panel and starts the clock. */
  function beginRecordingState() {
    fail('');
    el.scope.classList.add('is-idle');
    startedAt = Date.now();
    tick();
    clearInterval(clockTimer);
    clockTimer = setInterval(tick, 250);
    show('rec');
  }

  /** Updates the elapsed time. */
  function tick() {
    el.clock.textContent = fmt((Date.now() - startedAt) / 1000);
  }

  /** Stops the elapsed-time ticker. */
  function stopClock() {
    clearInterval(clockTimer);
    clockTimer = null;
  }

  /**
   * Draws the live waveform from values sent by the recording window.
   * @param {!Array<number>} values One value per bar, each 0..1.
   */
  function paintLive(values) {
    if (!values.length) {
      return;
    }
    el.scope.classList.remove('is-idle');
    for (var i = 0; i < el.liveBars.length; i++) {
      var value = Math.max(0.14, Math.min(1, values[i] || 0));
      el.liveBars[i].style.transform = 'scaleY(' + value.toFixed(3) + ')';
    }
  }

  // ---------------------------------------------------------------- saving

  /**
   * Saves a finished recording to Drive.
   * @param {{buffer: !ArrayBuffer, sampleRate: number, durationMs: number,
   *          label: string}} data The audio message.
   * @return {!Promise<void>}
   */
  function saveRecording(data) {
    stopClock();
    var bytes = new Uint8Array(data.buffer);
    if (!bytes.length) {
      postToRecorder(SarProtocol.TYPES.REJECTED, { message: 'The recording was empty.' });
      return Promise.resolve();
    }

    var label = (data.label || '').trim();
    fail('');
    show('saving');
    el.savingName.textContent = label ?
        'Saving “' + label + '” to your Drive…' : 'Saving your recording to Drive…';
    el.savingNote.textContent = fmt(data.durationMs / 1000) + ' · ' + fmtSize(bytes.length);
    progress(0);

    return call('beginUpload', {
      totalBytes: bytes.length,
      durationMs: data.durationMs,
      sampleRate: data.sampleRate,
      label: label,
      slideObjectId: null
    }).then(function (session) {
      return pushChunks(session, bytes);
    }).then(function (recording) {
      postToRecorder(SarProtocol.TYPES.ACCEPTED, {});
      progress(1);
      if (!boot.settings.addToSpeakerNotes) {
        return recording;
      }
      return call('noteRecordingInSpeakerNotes', recording.fileId, null)
          .then(function () {
            return recording;
          })
          .catch(function () {
            // Losing the speaker note must not lose the recording.
            return recording;
          });
    }).then(function (recording) {
      finish(recording);
    }).catch(function (err) {
      var message = err && err.message ? err.message : 'The recording could not be saved.';
      postToRecorder(SarProtocol.TYPES.REJECTED, { message: message });
      fail(message);
    });
  }

  /**
   * Streams the recording to the server one chunk at a time.
   * @param {{uploadId: string, chunkBytes: number}} session Upload session.
   * @param {!Uint8Array} bytes The whole file.
   * @return {!Promise<Object>} Resolves with the finished recording record.
   */
  function pushChunks(session, bytes) {
    var index = 0;
    var total = bytes.length;

    function next() {
      var start = index * session.chunkBytes;
      var slice = bytes.subarray(start, Math.min(start + session.chunkBytes, total));
      return call('pushChunk', session.uploadId, index, toBase64(slice)).then(function (result) {
        progress(result.offset / total);
        if (result.done) {
          return result.recording;
        }
        index++;
        return next();
      });
    }

    return next();
  }

  /**
   * @param {number} fraction Progress in [0, 1].
   */
  function progress(fraction) {
    el.trackFill.style.width = Math.round(Math.min(1, Math.max(0, fraction)) * 100) + '%';
  }

  /**
   * Moves to the panel that teaches Insert > Audio.
   * @param {Object} recording The saved recording.
   */
  function finish(recording) {
    boot.recordings.unshift(recording);
    if (recording.folderId && !boot.folderUrl) {
      boot.folderUrl = 'https://drive.google.com/drive/folders/' + recording.folderId;
      showFolderLink();
    }
    renderClips();
    updateHowTo(recording);
    el.doneMsg.textContent = recording.sharingNote || 'Saved to your Drive';
    show('done');
    refreshSlide();
  }

  // ------------------------------------------------------------------ done

  /**
   * Fills in the instructions for the newest recording.
   * @param {Object} recording The recording to name.
   */
  function updateHowTo(recording) {
    if (!recording) {
      return;
    }
    el.nativeName.value = recording.name;
    el.nativePath.textContent = 'In My Drive › Slide Audio Recordings › ' +
        (boot.presentation ? boot.presentation.name : 'this presentation');
  }

  /**
   * Copies the file name so it can be pasted into the Insert > Audio search box.
   *
   * The clipboard API is unreliable inside the add-on's sandboxed iframe, so
   * this selects the text and falls back to asking for the keyboard shortcut.
   */
  function copyFileName() {
    el.nativeName.focus();
    el.nativeName.select();
    var copied = false;
    try {
      copied = document.execCommand('copy');
    } catch (err) {
      copied = false;
    }
    el.btnCopyName.textContent = copied ? 'Copied' : 'Press Ctrl+C';
    setTimeout(function () {
      el.btnCopyName.textContent = 'Copy';
    }, 2500);
  }

  // ------------------------------------------------------------ clip list

  /** Redraws the list of recordings made in this presentation. */
  function renderClips() {
    var items = boot.recordings || [];
    el.idleClipsWrap.hidden = items.length === 0;
    el.idleClips.innerHTML = '';
    items.forEach(function (recording, index) {
      el.idleClips.appendChild(clipRow(recording, items.length - index));
    });
  }

  /**
   * @param {Object} recording The recording.
   * @param {number} number Display number.
   * @return {!Element} A clip row.
   */
  function clipRow(recording, number) {
    var row = document.createElement('div');
    row.className = 'clip';

    var badge = document.createElement('span');
    badge.className = 'n';
    badge.textContent = String(number);
    row.appendChild(badge);

    var meta = document.createElement('span');
    meta.className = 'meta';
    var name = document.createElement('b');
    name.textContent = recording.label || recording.name;
    name.title = recording.name;
    var sub = document.createElement('span');
    sub.textContent = [
      fmt((recording.durationMs || 0) / 1000),
      fmtSize(recording.sizeBytes),
      sharingWord(recording.sharing)
    ].filter(Boolean).join(' · ');
    meta.appendChild(name);
    meta.appendChild(sub);
    row.appendChild(meta);

    var acts = document.createElement('span');
    acts.className = 'acts';
    acts.appendChild(action('Insert', function () {
      updateHowTo(recording);
      el.doneMsg.textContent = 'Ready to add to your slide';
      show('done');
    }));
    var play = document.createElement('a');
    play.textContent = 'Play';
    play.href = recording.url;
    play.target = '_blank';
    play.rel = 'noopener';
    acts.appendChild(play);
    acts.appendChild(action('Delete', function () {
      removeClip(recording);
    }));
    row.appendChild(acts);

    return row;
  }

  /**
   * @param {string} text Button label.
   * @param {!Function} handler Click handler.
   * @return {!Element} The button.
   */
  function action(text, handler) {
    var button = document.createElement('button');
    button.type = 'button';
    button.textContent = text;
    button.addEventListener('click', handler);
    return button;
  }

  /**
   * @param {string} mode Sharing mode.
   * @return {string} Short description.
   */
  function sharingWord(mode) {
    return { anyone: 'anyone with link', domain: 'organisation', private: 'private' }[mode] || '';
  }

  /**
   * Moves a recording to the Drive bin.
   * @param {Object} recording The recording.
   */
  function removeClip(recording) {
    if (!window.confirm('Move this recording to the Drive bin? If it is already on a slide, it will ' +
        'stop playing.')) {
      return;
    }
    call('deleteRecording', recording.fileId).then(function (updated) {
      boot.recordings = updated;
      renderClips();
    }).catch(function (err) {
      fail(err.message);
    });
  }

  // --------------------------------------------------------------- context

  /**
   * Refreshes the "Slide n of m" line in the header.
   * @return {!Promise<void>}
   */
  function refreshSlide() {
    return call('describeCurrentSlide').then(function (slide) {
      boot.slide = slide;
      el.where.textContent = slide && slide.number ? 'Slide ' + slide.number + ' of ' + slide.total : '';
    }).catch(function () {
      // Not fatal: recordings are still named from the server's own view.
    });
  }

  // -------------------------------------------------------------- settings

  /** Copies settings into the form controls. */
  function applySettings() {
    el.setRate.value = String(boot.settings.sampleRate);
    el.setSharing.value = boot.settings.sharing;
    el.setNotes.checked = boot.settings.addToSpeakerNotes;
  }

  /**
   * Persists the settings form.
   * @return {!Promise<void>}
   */
  function saveSettings() {
    el.btnSaveSettings.disabled = true;
    return call('saveSettings', {
      sampleRate: Number(el.setRate.value),
      sharing: el.setSharing.value,
      addToSpeakerNotes: el.setNotes.checked
    }).then(function (saved) {
      boot.settings = saved;
      applySettings();
      show('idle');
    }).catch(function (err) {
      fail(err.message);
    }).then(function () {
      el.btnSaveSettings.disabled = false;
    });
  }

  // ------------------------------------------------------------------ init

  /** Reveals the Drive folder link once a folder exists. */
  function showFolderLink() {
    if (!boot.folderUrl) {
      return;
    }
    el.btnFolderOpen.hidden = false;
    el.btnFolderOpen.onclick = function () {
      window.open(boot.folderUrl, '_blank', 'noopener');
    };
  }

  /** Caches element references. */
  function cacheElements() {
    el = {
      mark: $('mark'),
      title: $('title'),
      where: $('where'),
      version: $('version'),
      linkHelp: $('link-help'),
      linkSettings: $('link-settings'),
      btnRecord: $('btn-record'),
      idleHint: $('idle-hint'),
      idleClipsWrap: $('idle-clips-wrap'),
      idleClips: $('idle-clips'),
      scope: $('scope'),
      clock: $('clock'),
      btnStop: $('btn-stop'),
      savingName: $('saving-name'),
      savingNote: $('saving-note'),
      trackFill: $('track-fill'),
      doneMsg: $('done-msg'),
      btnShowHow: $('btn-show-how'),
      nativeName: $('native-name'),
      btnCopyName: $('btn-copy-name'),
      nativePath: $('native-path'),
      btnDone: $('btn-done'),
      setRate: $('set-rate'),
      setSharing: $('set-sharing'),
      setNotes: $('set-notes'),
      btnSaveSettings: $('btn-save-settings'),
      btnSettingsBack: $('btn-settings-back'),
      btnFolderOpen: $('btn-folder-open')
    };
    document.querySelectorAll('.panel').forEach(function (panel) {
      panels[panel.dataset.panel] = panel;
    });
    for (var i = 0; i < LIVE_BARS; i++) {
      el.scope.appendChild(document.createElement('i'));
    }
    el.liveBars = el.scope.querySelectorAll('i');
  }

  /** Wires the UI and loads state from the server. */
  function init() {
    cacheElements();
    // Inlined by the build, so it can be shown before anything is fetched.
    el.mark.src = BRAND_ICON;

    el.btnRecord.addEventListener('click', openRecorder);
    el.btnStop.addEventListener('click', function () {
      postToRecorder(SarProtocol.TYPES.STOP, {});
    });
    el.btnCopyName.addEventListener('click', copyFileName);
    el.btnShowHow.addEventListener('click', function () {
      // The walkthrough is a 960-wide reproduction of the Slides UI, so the
      // server opens it as a dialog rather than squeezing it in here.
      call('showHowTo').catch(function (err) {
        fail(err.message);
      });
    });
    el.btnDone.addEventListener('click', function () {
      show('idle');
      el.idleHint.textContent = 'Tap to record';
    });
    el.btnSaveSettings.addEventListener('click', saveSettings);
    el.btnSettingsBack.addEventListener('click', function () {
      show('idle');
    });
    el.linkSettings.addEventListener('click', function (event) {
      event.preventDefault();
      show('settings');
    });
    window.addEventListener('message', onMessage);

    call('getBootstrap').then(function (data) {
      boot = data;
      el.title.textContent = boot.addonName;
      el.version.textContent = boot.addonName + ' · v' + boot.version;
      el.linkHelp.href = boot.supportUrl;
      showFolderLink();
      applySettings();
      renderClips();
      if (boot.recordings && boot.recordings.length) {
        updateHowTo(boot.recordings[0]);
      }
      el.where.textContent = boot.slide && boot.slide.number ?
          'Slide ' + boot.slide.number + ' of ' + boot.slide.total : '';
      el.btnRecord.disabled = false;
      show('idle');
    }).catch(function (err) {
      fail('The add-on could not start: ' + err.message);
    });
  }

  init();
}());
</script>
